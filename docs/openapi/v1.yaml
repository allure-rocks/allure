        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /publications/{id}:
    parameters:
      - $ref: "#/components/parameters/PublicationId"
    get:
      operationId: getPublication
      tags: [Social]
      summary: Read a publication
      description: A publication of this instance, yours or another account's, while it is served to you.
      x-allure-scope: social:read
      security:
        - bearerAuth: [social:read]
      responses:
        "200":
          description: The publication.
