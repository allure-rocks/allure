  /workouts/{workout_id}/publications:
    parameters:
      - $ref: "#/components/parameters/ParentWorkoutId"
    get:
      operationId: listWorkoutPublications
      tags: [Publishing]
      summary: List a workout's publications
      description: Its live and scheduled publications, at most one per audience.
      x-allure-scope: read
      security:
        - bearerAuth: [read]
      responses:
        "200":
          description: The publications.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Publication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: publishWorkout
      tags: [Publishing]
      summary: Publish a workout
      description: |
        Publishes the workout with one of your profiles. `acknowledge` must be
        `true`: it stands for your user having read what the preview says will
        be shared. With a safety delay the publication is `scheduled` and
        nobody sees it until it activates; without one it is live at once. A
        live publication of the same audience is replaced, as the website's
        Republish does: the old one is deleted and the instances it reached
        are told. A workout credited to you from another account's recording
        is never published (`credited_workout`).
      x-allure-scope: publish
      security:
        - bearerAuth: [publish]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publishing_profile_id, acknowledge]
              additionalProperties: false
              properties:
                publishing_profile_id: { $ref: "#/components/schemas/Id" }
                delay: { $ref: "#/components/schemas/PublishDelay" }
                acknowledge:
                  type: boolean
                  const: true
                  description: Your user has read what will be shared and that copies cannot be recalled.
      responses:
        "201":
          description: The new publication.
          headers:
            Location:
              description: The publication's URL.
              schema: { type: string, format: uri }
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workouts/{workout_id}/publication_previews:
    parameters:
