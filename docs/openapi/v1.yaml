        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: reschedulePublication
      tags: [Publishing]
      summary: Reschedule a publication
      description: Moves a scheduled publication to another delay, counted from now. What it shares does not change.
      x-allure-scope: publish
      security:
        - bearerAuth: [publish]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delay]
              additionalProperties: false
              properties:
                delay:
                  type: string
                  enum: [immediate, 1_day, 3_days, 1_week, 2_weeks, 1_month]
                  description: "`immediate` schedules it for now; it activates within moments."
      responses:
        "200":
          description: The rescheduled publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deletePublication
      tags: [Publishing]
      summary: Delete or cancel a publication
      description: |
        Deletes a live publication: it leaves this instance and a deletion
        notice goes to the instances that know it; copies they already fetched
        cannot be recalled. A scheduled publication, which nobody has seen, is
        cancelled without a trace.
      x-allure-scope: publish
      security:
        - bearerAuth: [publish]
      responses:
        "204":
          description: Deleted or cancelled.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

