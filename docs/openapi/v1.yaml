openapi: 3.1.0
info:
  title: Allure REST API
  # Replaced at request time by the application version (PLAN_API.md §3).
  version: "0"
  summary: Read and manage your Allure workouts from your own programs.
  description: |
    The Allure REST API gives programs you write — scripts, automations,
    dashboards — access to **your own account** on this Allure instance.

    ## Authentication

    Create an API token in **Settings → API et webhooks** and send it with every
    request:

    ```
    Authorization: Bearer allure_pat_…
    ```

    A token carries the permissions (scopes) you tick when you create it; an
    operation names the scope it needs. Tokens expire after at most a year and
    can be revoked at any time. The secret is shown once.

    ## Privacy

    The API never shows more than the website does. Your own workouts are yours
    in full; nothing about another account is reachable here except what that
    account published to you.

    ## Conventions

    - **Units** are SI, exactly as stored: metres, seconds, metres per second,
      beats per minute, watts. Pace is never pre-computed; a sport's
      `pace_basis_metres` tells you over which distance its pace is shown.
    - **Instants** are RFC 3339 in UTC. **Durations** are whole seconds.
    - **Coordinates** are GeoJSON `[longitude, latitude]`.
    - **Identifiers** are opaque 22-character strings.
    - **Lists** are paginated with an opaque cursor: pass `next_cursor` back as
      `cursor` until it is `null`.
    - **Errors** are [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) problem
      documents; branch on `code`.
    - **Enumerations** are open: tolerate values you do not know.
    - **Rate limits**: 300 requests per minute per token, 60 of them writes,
      and 20 imports per hour. Over the limit you get `429` with `Retry-After`.
    - **Retries**: send an `Idempotency-Key` header with a `POST`. A retry
      with the same key and the same request gets the first response back,
      marked `Idempotency-Replayed: true`, for 24 hours.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  # Replaced at request time by this instance's URL.
  - url: /api/rest/v1
security:
  - bearerAuth: []
tags:
  - name: Account
    description: The account the token belongs to, and the sport catalog.
  - name: Workouts
    description: Your workouts, their tracks, original files and analysis.
  - name: Records
    description: Your personal records.
  - name: Imports
    description: |
      Import GPX, FIT, TCX or KML files, ZIP archives or single-file GZIP
      sources. An import answers `202` as soon as the files are stored; poll
      it until its `status` is `completed`, `failed` or `cancelled`. Imports
      follow the website's rules: duplicates are skipped, and an automatic
      publishing profile publishes recent imports of up to five files.
  - name: Equipment
    description: Your gear and its lifetime totals.
  - name: Publishing
    description: |
      Your publishing profiles and your workouts' publications. Publishing
      follows the website's rules exactly: the profile decides what is
      shared, your privacy zones are applied, a profile's safety delay holds
      the publication before anyone sees it, and a workout has at most one
      live publication per audience. Show your user what will be shared — the
      preview's `copy` — before you publish: copies other instances receive
      cannot be recalled.
  - name: Social
    description: |
      What other accounts published to you, exactly as the website shows it:
      the feed, a publication or a received note, its comments and reactions,
      and your followers and the accounts you follow. Read-only: commenting,
      reacting and following stay on the website. Everything is built from
      what was published — a field the author's profile did not share is
      absent, never `null` — and something you cannot read on the website is
      a `404` here.
  - name: Webhooks
    description: |
      A webhook is an HTTPS address of yours that Allure calls when something
      happens on your account. Each call is a `POST` of a JSON envelope —
      `{ id, type, created_at, api_version, data }` — signed as
      [Standard Webhooks](https://www.standardwebhooks.com/) specifies, so
      any of its libraries verifies it:

      - `webhook-id` is the envelope's `id`, the same for every retry;
      - `webhook-timestamp` is the Unix time of this attempt;
      - `webhook-signature` is `v1,` followed by the Base64
        HMAC-SHA256 of `<webhook-id>.<webhook-timestamp>.<body>`, keyed with
        the Base64-decoded part of your secret after `whsec_`. After a secret
        rotation, two signatures are sent, space-separated, for 24 hours.

      Refuse a timestamp more than 5 minutes away from your clock. Answer
      `2xx` quickly; anything else is retried after 1 min, 5 min, 30 min,
      2 h, 6 h and 12 h. `410 Gone` disables the webhook at once, and a
      webhook failing for 3 days and 20 calls in a row is disabled. Delivery
      is at least once and unordered: deduplicate by `id`, order by
      `created_at`. Redirects are not followed. Payloads never carry a track
      or a file. The events are listed under **Webhooks** below.
  - name: Problems
    description: |
      Every error is an RFC 9457 problem document with a stable `code`:

      | code | status | meaning |
      |---|---|---|
      | `missing_token` | 401 | No `Authorization: Bearer` header. |
      | `invalid_token` | 401 | The token is unknown, revoked or expired. |
      | `account_suspended` | 403 | The account is suspended. |
      | `account_deletion_scheduled` | 403 | The account is scheduled for deletion; it can only cancel it on the website. |
      | `second_factor_required` | 403 | The account must set up two-step verification on the website first. |
      | `insufficient_scope` | 403 | The token lacks the operation's scope. |
      | `not_found` | 404 | No such resource, or not visible to this token. |
      | `invalid_parameter` | 400 | A parameter is malformed or unknown. |
      | `invalid_cursor` | 400 | The cursor is malformed or belongs to another ordering. |
      | `validation_failed` | 422 | Some fields were refused; `errors` lists them. |
      | `sport_change_failed` | 422 | The workout could not be analysed again for the new sport; nothing changed. |
      | `credited_workout` | 422 | The workout is another account's activity credited to you: it can only be deleted. |
      | `import_finished` | 409 | The import has already finished. |
      | `import_limit` | 429 | Too many imports are waiting, or the day's upload budget is spent; `reason` says which and `Retry-After` when to try again. |
      | `idempotency_key_reused` | 422 | The `Idempotency-Key` was used with a different request. |
      | `idempotency_key_in_progress` | 409 | A request with this `Idempotency-Key` is still running. |
      | `acknowledgement_required` | 422 | Publishing needs `acknowledge: true`. |
      | `publication_refused` | 422 | The workout cannot be published with this profile; `reason` says why. |
      | `not_scheduled` | 409 | Only a scheduled publication can be activated or rescheduled. |
      | `webhook_inactive` | 409 | The webhook is paused or disabled. |
      | `rate_limited` | 429 | Too many requests; see `Retry-After`. |

paths:
  /me:
    get:
      operationId: getMe
      tags: [Account]
      summary: Get the account
      description: The account the token belongs to, and the token itself. Any scope.
      x-allure-scope: any
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /sports:
    get:
      operationId: listSports
      tags: [Account]
      summary: List sports
      description: The sport catalog, in display order, with labels in every locale. Any scope.
      x-allure-scope: any
      responses:
        "200":
          description: The sports.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Sport" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workouts:
    get:
      operationId: listWorkouts
      tags: [Workouts]
      summary: List workouts
      description: Your workouts, newest first by default, with the website's filters.
      x-allure-scope: read
      security:
        - bearerAuth: [read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: sort
          in: query
          description: Ordering; a leading `-` sorts descending.
          schema:
            type: string
            enum: [-started_at, started_at, -distance, distance, -duration, duration, -ascent, ascent]
            default: -started_at
        - name: sport
          in: query
          description: Comma-separated sport slugs.
          schema: { type: string, examples: ["cycling_gravel,running"] }
        - name: from
          in: query
          description: First start date, inclusive, in the account's time zone.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Last start date, inclusive, in the account's time zone.
          schema: { type: string, format: date }
        - name: commute
          in: query
          description: Only commutes (`true`) or only other workouts (`false`).
          schema: { type: boolean }
        - name: published
          in: query
          description: Only workouts with (`true`) or without (`false`) a live publication.
          schema: { type: boolean }
        - name: equipment
          in: query
          description: Only workouts using this piece of equipment.
          schema: { $ref: "#/components/schemas/Id" }
        - name: place
          in: query
          description: A place name the workout passed, matched case-insensitively.
          schema: { type: string, maxLength: 120 }
        - name: q
          in: query
          description: Text searched in titles and descriptions.
          schema: { type: string }
      responses:
        "200":
          description: A page of workouts.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WorkoutSummary" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createWorkout
      tags: [Workouts]
      summary: Enter a workout by hand
      description: |
        Creates a manual entry, as the website's « Manual entry » import
        source: a workout with no file, no track and only the figures you send
        (`origin: manual`). It counts in your totals, statistics and equipment
        wear, but never in your records, best efforts or segments, and it
        cannot be published. An `ascent` for a sport that measures no
        elevation (a swim, a strength session) is refused. To import a file,
        use `POST /imports`.
      x-allure-scope: write
      security:
        - bearerAuth: [write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualWorkoutCreate" }
      responses:
        "201":
          description: The manual entry.
          headers:
            Location:
              description: The workout's URL.
              schema: { type: string, format: uri }
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workouts/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkoutId"
    get:
      operationId: getWorkout
      tags: [Workouts]
      summary: Get a workout
      description: One of your workouts, with its owner-only analysis detail.
      x-allure-scope: read
      security:
        - bearerAuth: [read]
      responses:
        "200":
          description: The workout.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: updateWorkout
      tags: [Workouts]
      summary: Update a workout
      description: |
        Changes the fields you send, and only those: the website's edit form.
        A new `sport` analyses the workout again from its original file, as on
        the website; if that fails, nothing changes (`sport_change_failed`).
        `equipment_ids` replaces the workout's equipment; inactive equipment
        already on the workout stays, and is not added otherwise. A workout
        credited to you from another account's recording cannot be changed
        (`credited_workout`). A manual entry also takes its figures
        (`started_at`, `elapsed_time`, `moving_time`, `distance`, `ascent`,
        `average_heart_rate`, `max_heart_rate`, `calories`, `average_power`);
        its new `sport` analyses nothing. A recording's figures are measured
        from its file and are refused with `not_editable`.
      x-allure-scope: write
      security:
        - bearerAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutUpdate" }
      responses:
        "200":
          description: The updated workout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: deleteWorkout
      tags: [Workouts]
      summary: Delete a workout
      description: |
        Deletes the workout and its original file, as the website does. Its
        live publications are deleted too, and the instances they reached are
        told; a scheduled publication is cancelled. This cannot be undone.
      x-allure-scope: write
      security:
        - bearerAuth: [write]
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workouts/{id}/track:
    parameters:
      - $ref: "#/components/parameters/WorkoutId"
    get:
      operationId: getWorkoutTrack
      tags: [Workouts]
      summary: Get a workout's track
      description: |
        The recorded track as a GeoJSON FeatureCollection: one `LineString`
        Feature per recording segment, never joined across a pause. Per-point
        measurements are parallel arrays in `properties`, aligned with the
        coordinates; a measurement absent from every point of a segment is
        omitted for that segment.
      x-allure-scope: read
      security:
        - bearerAuth: [read]
      responses:
        "200":
          description: The track.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/geo+json:
              schema: { $ref: "#/components/schemas/Track" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workouts/{id}/original:
    parameters:
      - $ref: "#/components/parameters/WorkoutId"
    get:
      operationId: getWorkoutOriginal
      tags: [Workouts]
      summary: Download the original file
      description: The GPX, FIT, TCX or KML file the workout was imported from, byte for byte.
      x-allure-scope: read
      security:
        - bearerAuth: [read]
      responses:
        "200":
          description: The original file.
          headers:
            Content-Disposition:
              description: "`attachment` with the original file name."
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, description: The file's bytes. }
            application/gpx+xml:
              schema: { type: string }
            application/vnd.ant.fit:
              schema: { type: string }
            application/vnd.garmin.tcx+xml:
              schema: { type: string }
            application/vnd.google-earth.kml+xml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workouts/{id}/laps:
    parameters:
      - $ref: "#/components/parameters/WorkoutId"
    get:
      operationId: listWorkoutLaps
      tags: [Workouts]
      summary: List a workout's laps
      description: "The laps the device recorded (`source: recorded`), then every lap Allure detected — loops, route repeats, pauses, climbs, descents, stops, speed and power intervals — each with its `source`."
      x-allure-scope: read
      security:
        - bearerAuth: [read]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Lap" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workouts/{id}/splits:
    parameters:
      - $ref: "#/components/parameters/WorkoutId"
    get:
      operationId: listWorkoutSplits
      tags: [Workouts]
      summary: List a workout's splits
      description: "Splits over `distance` metres (1000 by default), within each recording segment; the last one may be `partial`."
      x-allure-scope: read
      security:
        - bearerAuth: [read]
      parameters:
        - name: distance
          in: query
          description: Split length in metres (100 to 100000; 1609 for miles).
          schema: { type: integer, minimum: 100, maximum: 100000, default: 1000 }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { type: object, required: [distance, data], properties: { distance: { type: integer }, data: { type: array, items: { $ref: "#/components/schemas/Split" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workouts/{id}/best_efforts:
    parameters:
      - $ref: "#/components/parameters/WorkoutId"
    get:
      operationId: listWorkoutBestEfforts
      tags: [Workouts]
      summary: List a workout's best efforts
      description: "The fastest time over each standard distance within the workout, with its personal place among all your efforts over that sport and distance (1 is the record)."
      x-allure-scope: read
      security:
        - bearerAuth: [read]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/BestEffort" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /workouts/{id}/segment_efforts:
    parameters:
      - $ref: "#/components/parameters/WorkoutId"
    get:
      operationId: listWorkoutSegmentEfforts
      tags: [Workouts]
      summary: List a workout's segment efforts
      description: "Every segment the workout matched, with your personal place on it and your rank on its leaderboard when the board ranks you."
      x-allure-scope: read
      security:
        - bearerAuth: [read]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/SegmentEffort" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /records:
    get:
      operationId: listRecords
      tags: [Records]
      summary: List personal records
      description: "Your records per sport, as « Mes records » shows them: the classic records (`AP` average pace, `AS` average speed, `BP` best pace, `FD` farthest distance, `HA` highest ascent, `LD` longest moving time, `MS` maximum speed, `MC` biggest climb; SI values) and the best-effort records per standard distance."
      x-allure-scope: read
      security:
        - bearerAuth: [read]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Records" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /imports:
    get:
      operationId: listImports
      tags: [Imports]
      summary: List imports
      description: Your imports, newest first, without their entries.
      x-allure-scope: import or read
      security:
        - bearerAuth: [import]
        - bearerAuth: [read]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of imports.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ImportSummary" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createImport
      tags: [Imports]
      summary: Import files
      description: |
        Uploads files to import, as the website's import form: at most 1000
        files and 500 MB in total. `fallback_sport` is the sport of a file that
        records none. Answers `202` once the files are stored, before any is
        read; follow the `Location`.

        With `source=strava_archive`, send exactly one Strava archive (the
        `.zip` Strava sends, up to 2 GB): each activity is imported with its
        Strava name, type, description, private note, commute flag, gear and
        photos, and an activity typed in by hand becomes a manual entry.
        `fallback_sport` is then optional and `notes` is ignored.

        An account may have at most 3 file imports and 1 Strava archive
        waiting or running, and upload at most 6 GB in 24 hours; beyond that
        the answer is `429` `import_limit` with a `reason`
        (`too_many_active_imports`, `archive_in_progress`,
        `upload_budget_exceeded`). The uploaded files are deleted once the
        import finishes.
      x-allure-scope: import
      security:
        - bearerAuth: [import]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                source:
                  type: string
                  enum: [file, strava_archive]
                  default: file
                  description: What `files[]` holds.
                files:
                  type: array
                  description: |
                    GPX, FIT, TCX or KML files, ZIP archives, or single-file
                    GZIP sources. Send each file as a part named `files[]`, for
                    example `curl -F "files[]=@ride.fit" -F fallback_sport=cycling`.
                  items: { type: string, description: The file's bytes. }
                fallback_sport:
                  type: string
                  description: A sport slug from `GET /sports`; required unless `source` is `strava_archive`.
                  examples: [cycling]
