name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds the selected branch as a test image. It publishes
  # `test-<tag>` only: `latest` and the release tags belong to `v*` tag pushes.
  workflow_dispatch:
    inputs:
      tag:
        description: "Suffix of the test-<suffix> image tag; defaults to the short commit SHA"
        type: string
        required: false
      push:
        description: "Push the images to Docker Hub"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The images are linux/amd64 for now. A public repository can add a native
  # arm64 job (ubuntu-24.04-arm) and merge the manifests; the QEMU route is
  # too slow for the Chromium layer.
  images:
    name: Container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # A tag push publishes the release itself; a manual run cannot reach
      # those tags, nor `latest`, whatever its input says.
      - name: Resolve the image tags
        id: tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            latest=true
          else
            suffix="${INPUT_TAG:-${GITHUB_SHA:0:7}}"
            if ! printf '%s' "$suffix" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,120}$'; then
              echo "::error::'$suffix' is not a valid Docker tag suffix."
              exit 1
            fi
            tag="test-$suffix"
            latest=false
          fi

          {
            echo "tag=$tag"
            echo "app<<EOF"
            echo "allurerocks/allure:$tag"
            if [ "$latest" = true ]; then echo "allurerocks/allure:latest"; fi
            echo "EOF"
            echo "route_image<<EOF"
            echo "allurerocks/allure-route-image:$tag"
            if [ "$latest" = true ]; then echo "allurerocks/allure-route-image:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize the image tags
        env:
          PUSH: ${{ github.event_name == 'push' || inputs.push }}
        run: |
          {
            echo "### Container images"
            echo
            echo "- \`allurerocks/allure:${{ steps.tags.outputs.tag }}\`"
            echo "- \`allurerocks/allure-route-image:${{ steps.tags.outputs.tag }}\`"
            echo
            if [ "$PUSH" = true ]; then
              echo "Pushed to Docker Hub."
            else
              echo "Built only; nothing was pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' || inputs.push }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the application image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.tags.outputs.app }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the route-image worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: route-image-worker
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.tags.outputs.route_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    name: Documentation
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci --include=dev --prefix docs/site
      - run: npm --prefix docs/site run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [images, docs]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Allure $version" \
            --notes-file release-notes.md
