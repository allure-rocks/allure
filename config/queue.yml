default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: <%= ENV.fetch("SOLID_QUEUE_QUEUES", "default,solid_queue_recurring,federation,federation_media,remote_imports,webhooks,photos").split(",").map(&:strip).reject(&:empty?).inspect %>
      threads: <%= ENV.fetch("SOLID_QUEUE_THREADS", 3) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
