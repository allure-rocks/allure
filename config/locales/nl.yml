        - "Een sessie zonder hartslag telt als nul; een sessie waarin die maar deels is opgenomen, telt alleen dat deel. Er wordt niets in de plaats geschat."
        - "Beide gemiddelden beginnen bij nul bij je eerste sessie met hartslag: de fitheid is pas na ongeveer zes weken representatief."
