  account_exports:
    readme: |
      Allure-gegevensarchief van @%{username}, gemaakt op %{date} (exportformaat %{version}).

      Inhoud
      - account.json: profiel, voorkeuren, meldingsinstellingen, factoren voor verificatie in twee stappen (soort en datum), identiteitsproviders en gekoppelde diensten.
      - sessions.json: open sessies, met het apparaat, het IP-adres en de inlogmethode.
      - workouts/index.json en workouts/index.csv: één regel per activiteit.
      - workouts/originals-NNN.zip: je originele bestanden zoals ze zijn geïmporteerd, maximaal %{per_archive} per archief.
      - records.json: records en beste prestaties.
      - segments.json en segments.geojson: je segmenten en hun hoogteprofiel.
      - equipment.json, publishing_profiles.json, privacy_zones.geojson: uitrusting, publicatieprofielen, privacyzones.
      - publications.json: je publicaties, actief of verwijderd.
      - social/: gevolgde accounts en volgers (Mastodon-formaat), opmerkingen, reacties.
      - avatar.webp: je avatar, als je er een hebt geüpload.
      - photos/: de originele foto's van je activiteiten (inclusief metadata) en photos/index.json met hun bijschriften en volgorde. Deze bestanden worden niet automatisch opnieuw geïmporteerd.

      Eenheden: meter, seconden, meter per seconde. Datums zijn in UTC (ISO 8601), coördinaten zijn [lengtegraad, breedtegraad].

      In de CSV-bestanden begint een tekstcel die met =, +, -, @ of een tab begint met ', zodat een spreadsheet die niet als formule uitvoert; de JSON-bestanden bewaren elke waarde ongewijzigd.

      Je activiteiten opnieuw importeren: sleep elk bestand workouts/originals-NNN.zip naar de importpagina van een Allure-instantie.

      Dit archief bevat geen geheimen: geen wachtwoord, verificatie in twee stappen, API-token, webhookgeheim of inloggegevens van gekoppelde diensten.
