  account_exports:
    readme: |
      Allure data archive of @%{username}, prepared on %{date} (export format %{version}).

      Contents
      - account.json: profile, preferences, notification settings, two-step verification factors (kind and date), identity providers and connected services.
      - sessions.json: open sessions, with the device, IP address and sign-in method.
      - workouts/index.json and workouts/index.csv: one row per workout.
      - workouts/originals-NNN.zip: your original files as imported, at most %{per_archive} per archive.
      - records.json: records and best efforts.
      - segments.json and segments.geojson: your segments and their elevation profile.
      - equipment.json, publishing_profiles.json, privacy_zones.geojson: equipment, publishing profiles, privacy zones.
      - publications.json: your publications, live or withdrawn.
      - social/: following and followers (Mastodon format), comments, reactions.
      - avatar.webp: your avatar, if you uploaded one.
      - photos/: your original activity photos (metadata included), and photos/index.json with their captions and order. These files are not re-imported automatically.

      Units: metres, seconds, metres per second. Dates are UTC (ISO 8601), coordinates are [longitude, latitude].

      In the CSV files, a text cell starting with =, +, -, @ or a tab begins with ' so that a spreadsheet does not run it as a formula; the JSON files keep every value as it is.

      Re-importing your workouts: drop each workouts/originals-NNN.zip file on the import page of an Allure instance.

      This archive holds no secret: no password, two-step verification, API token, webhook secret or connected-service credential.
