      how_title: How to read these figures
      how:
        - "Load: each session with heart rate counts its minutes in each zone, multiplied by the zone's number (Edwards' method). Time under the floor of your zones — 50% of your maximum heart rate with the default thresholds — does not count."
        - "Fitness: the average of your daily load over 42 days, recent days weighing more. It is what you have built."
        - "Fatigue: the same average over 7 days. It is what you are absorbing."
        - "Form: the previous day's fitness minus its fatigue. Positive, you are fresh; negative, you are carrying load, which is normal in the middle of a training block."
        - "These points are Allure's own: they compare neither with another application's load, nor with its fitness or form, nor from one person to another. Follow how they change."
        - "A session without heart rate counts as zero; a session where it was recorded only in part counts that part only. Nothing is estimated in its place."
