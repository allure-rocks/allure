      title: Import finished
      body: 3 workouts were added.
    notifications:
      intro: The topbar bell shows the unread count and opens the latest items; the full, paginated list is a page of its own.
      unread: "%{name} wants to follow you"
      read: "%{name} accepted your follow request"
      handle: "@demo@exemple.test"
      view_all: View all notifications
      mark_all_read: Mark all as read
    modal:
      button: Delete
      title: Delete this example?
      body: This demo example is permanently deleted. Confirming reloads this page.
      verb: Delete
    unsaved_changes:
      hint: Leaving a page, reloading it, or saving another form while changes are pending asks first.
      dialog_button: Show the confirmation
    release_notes:
      hint: The footer version opens the release notes dialog. It opens itself once per account after a release, and only when the release has curated notes.
    admin:
      hint: The operator console uses the same Tabler shell with its own menu, no bottom bar or feedback widget, and an explicit exit back to the product.
      entry_hint: Entry is the account menu's Administration item, rendered only for the configured instance operator; every console route answers 404 to everyone else.
    states:
      loading: Loading workouts…
      error_title: The chart could not be loaded.
      error_body: Check your connection, then try again.
      retry: Retry
      partial: "Partial data: heart rate was not recorded on this workout."
      empty_new: Nothing here yet. Import a GPX and this fills up fast.
      empty_new_action: Import a workout
      empty_filtered: No workouts match these filters.
      empty_filtered_action: Clear filters
