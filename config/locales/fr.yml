  account_exports:
    readme: |
      Archive des données Allure de @%{username}, préparée le %{date} (format d'export %{version}).

      Contenu
      - account.json : profil, préférences, réglages de notification, facteurs de double authentification (type et date), fournisseurs d'identité et services connectés.
      - sessions.json : sessions ouvertes, avec l'appareil, l'adresse IP et la méthode de connexion.
      - workouts/index.json et workouts/index.csv : une ligne par activité.
      - workouts/originals-NNN.zip : vos fichiers d'origine tels qu'importés, %{per_archive} au plus par archive.
      - records.json : records et meilleurs efforts.
      - segments.json et segments.geojson : vos segments et leur profil d'altitude.
      - equipment.json, publishing_profiles.json, privacy_zones.geojson : équipements, profils de publication, zones de confidentialité.
      - publications.json : vos publications, actives ou retirées.
      - social/ : abonnements et abonnés (format Mastodon), commentaires, réactions.
      - avatar.webp : votre avatar, si vous en avez téléversé un.
      - photos/ : vos photos originales des activités (métadonnées comprises), et photos/index.json avec leurs légendes et leur ordre. Ces fichiers ne sont pas réimportés automatiquement.

      Unités : mètres, secondes, mètres par seconde. Les dates sont en UTC (ISO 8601), les coordonnées en [longitude, latitude].

      Dans les fichiers CSV, une cellule de texte commençant par =, +, -, @ ou une tabulation est précédée de ' pour qu'un tableur ne l'exécute pas comme une formule ; les fichiers JSON gardent chaque valeur telle quelle.

      Réimporter vos activités : déposez chaque fichier workouts/originals-NNN.zip sur la page d'import d'une instance Allure.

      Aucun secret ne figure dans cette archive : ni mot de passe, ni double authentification, ni jeton d'API, ni secret de webhook, ni identifiant de service connecté.
