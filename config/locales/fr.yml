fr:
  funding:
    title: Soutenir l'instance
    explanation: Votre soutien aide à payer l'hébergement de cette instance. Il est facultatif et ne débloque aucune fonctionnalité. Le paiement se fait sur le site du prestataire. Vous pouvez masquer le badge et choisir sa couleur.
    manual_confirmation: L'hébergeur confirme les paiements manuellement. Votre badge apparaît après cette confirmation, pas immédiatement après le paiement. Il est valable un an à partir de cette confirmation et ne se renouvelle pas automatiquement.
    automatic_renewal: Votre abonnement se renouvelle automatiquement chaque année. La résiliation se fait dans le portail du prestataire ; le badge reste valable jusqu'à la fin de la période déjà payée.
    contribute: Contribuer
    subscribe: Devenir souteneur annuel
    tier_automatic: Abonnement annuel à renouvellement automatique.
    tier_manual: Paiement ponctuel, confirmé manuellement.
