  account_exports:
    readme: |
      Archivo de datos de Allure de @%{username}, preparado el %{date} (formato de exportación %{version}).

      Contenido
      - account.json: perfil, preferencias, ajustes de notificaciones, factores de verificación en dos pasos (tipo y fecha), proveedores de identidad y servicios conectados.
      - sessions.json: sesiones abiertas, con el dispositivo, la dirección IP y el método de inicio de sesión.
      - workouts/index.json y workouts/index.csv: una fila por actividad.
      - workouts/originals-NNN.zip: tus archivos originales tal como se importaron, como máximo %{per_archive} por archivo.
      - records.json: récords y mejores esfuerzos.
      - segments.json y segments.geojson: tus segmentos y su perfil de altitud.
      - equipment.json, publishing_profiles.json, privacy_zones.geojson: equipo, perfiles de publicación, zonas de privacidad.
      - publications.json: tus publicaciones, activas o eliminadas.
      - social/: cuentas seguidas y seguidores (formato Mastodon), comentarios, reacciones.
      - avatar.webp: tu avatar, si subiste uno.
      - photos/: las fotos originales de tus actividades (metadatos incluidos) y photos/index.json con sus pies de foto y su orden. Estos archivos no se vuelven a importar automáticamente.

      Unidades: metros, segundos, metros por segundo. Las fechas están en UTC (ISO 8601) y las coordenadas son [longitud, latitud].

      En los archivos CSV, una celda de texto que empieza por =, +, -, @ o un tabulador va precedida de ' para que una hoja de cálculo no la ejecute como fórmula; los archivos JSON conservan cada valor tal cual.

      Volver a importar tus actividades: arrastra cada archivo workouts/originals-NNN.zip a la página de importación de una instancia de Allure.

      Este archivo no contiene ningún secreto: ni contraseña, ni verificación en dos pasos, ni token de API, ni secreto de webhook, ni credenciales de servicios conectados.
