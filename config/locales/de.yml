  account_exports:
    readme: |
      Allure-Datenarchiv von @%{username}, erstellt am %{date} (Exportformat %{version}).

      Inhalt
      - account.json: Profil, Einstellungen, Benachrichtigungseinstellungen, Faktoren der Bestätigung in zwei Schritten (Art und Datum), Identitätsanbieter und verbundene Dienste.
      - sessions.json: offene Sitzungen, mit Gerät, IP-Adresse und Anmeldemethode.
      - workouts/index.json und workouts/index.csv: eine Zeile pro Aktivität.
      - workouts/originals-NNN.zip: deine Originaldateien wie importiert, höchstens %{per_archive} pro Archiv.
      - records.json: Rekorde und Bestzeiten.
      - segments.json und segments.geojson: deine Segmente und ihr Höhenprofil.
      - equipment.json, publishing_profiles.json, privacy_zones.geojson: Ausrüstung, Veröffentlichungsprofile, Privatsphäre-Zonen.
      - publications.json: deine Veröffentlichungen, aktiv oder gelöscht.
      - social/: Gefolgte und Follower (Mastodon-Format), Kommentare, Reaktionen.
      - avatar.webp: dein Avatar, falls du einen hochgeladen hast.
      - photos/: deine originalen Aktivitätsfotos (inklusive Metadaten) und photos/index.json mit ihren Bildunterschriften und ihrer Reihenfolge. Diese Dateien werden nicht automatisch erneut importiert.

      Einheiten: Meter, Sekunden, Meter pro Sekunde. Datumsangaben sind in UTC (ISO 8601), Koordinaten sind [Längengrad, Breitengrad].

      In den CSV-Dateien beginnt eine Textzelle, die mit =, +, -, @ oder einem Tabulator anfängt, mit ', damit eine Tabellenkalkulation sie nicht als Formel ausführt; die JSON-Dateien behalten jeden Wert unverändert.

      Aktivitäten erneut importieren: Zieh jede Datei workouts/originals-NNN.zip auf die Importseite einer Allure-Instanz.

      Dieses Archiv enthält kein Geheimnis: kein Passwort, keine Bestätigung in zwei Schritten, kein API-Token, kein Webhook-Geheimnis und keine Zugangsdaten verbundener Dienste.
